{% extends "base.html" %}

{% block title %}Gallery{% endblock %}

{% block extra_css %}
<style>
    .gallery-page { padding: 3rem 0; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
    .gallery-item { position: relative; overflow: hidden; border-radius: var(--radius-md); aspect-ratio: 16/9; background: var(--primary-light); display: flex; align-items: center; justify-content: center; color: white; font-size: 3rem; }
    .gallery-item:hover { transform: scale(1.02); transition: transform 0.3s; }
</style>
{% endblock %}

{% block content %}
<div class="gallery-page">
    <div class="container">
        <h1 class="text-center mb-4" style="color: var(--primary);">Photo Gallery</h1>
        
        <div class="gallery-grid">
            <div class="gallery-item"><i class="fas fa-graduation-cap"></i></div>
            <div class="gallery-item"><i class="fas fa-building"></i></div>
            <div class="gallery-item"><i class="fas fa-users"></i></div>
            <div class="gallery-item"><i class="fas fa-book-reader"></i></div>
            <div class="gallery-item"><i class="fas fa-laptop-code"></i></div>
            <div class="gallery-item"><i class="fas fa-running"></i></div>
            <div class="gallery-item"><i class="fas fa-music"></i></div>
            <div class="gallery-item"><i class="fas fa-palette"></i></div>
        </div>
        
        <div class="mt-4 text-center">
            <p class="text-muted">Coming soon: More photos from campus events, fests, and activities.</p>
        </div>
    </div>
</div>
{% endblock %}
