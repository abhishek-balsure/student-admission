{% extends "base.html" %}

{% block title %}Admin Login - Sarhad College{% endblock %}

{% block extra_css %}
<style>
    .auth-page { min-height: calc(100vh - 250px); display: flex; align-items: center; justify-content: center; padding: 2rem; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 50%, var(--secondary) 100%); }
    .auth-container { background: white; padding: 3rem; border-radius: var(--radius-lg); width: 100%; max-width: 450px; box-shadow: var(--shadow-lg); }
    .auth-header { text-align: center; margin-bottom: 2.5rem; }
    .auth-header h1 { font-size: 2rem; color: var(--primary); margin-bottom: 0.5rem; font-family: 'Playfair Display', serif; }
    .auth-header p { color: var(--text-muted); }
    .auth-header i { font-size: 3rem; color: var(--primary); margin-bottom: 1rem; }
    .btn-auth { width: 100%; padding: 1rem; background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); color: white; border: none; border-radius: var(--radius-sm); font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: var(--transition); }
    .btn-auth:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .auth-footer { text-align: center; margin-top: 1.5rem; color: var(--text-muted); }
    .auth-footer a { color: var(--secondary); text-decoration: none; font-weight: 600; }
    .password-toggle { position: relative; }
    .password-toggle input { padding-right: 3rem; }
    .password-toggle i { position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted); }
    .password-toggle i:hover { color: var(--primary); }
    .admin-badge { display: inline-block; background: var(--danger); color: white; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; margin-bottom: 1rem; }
</style>
{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-header">
            <span class="admin-badge">ADMIN</span>
            <i class="fas fa-user-shield"></i>
            <h1>Admin Portal</h1>
            <p>Login to manage applications</p>
        </div>
        
        <form method="POST" action="{{ url_for('admin_login') }}">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="password-toggle">
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
                    <i class="fas fa-eye" id="togglePassword"></i>
                </div>
            </div>
            
            <button type="submit" class="btn-auth">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>
        
        <div class="auth-footer">
            <p><a href="{{ url_for('login') }}">Student Login</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.getElementById('togglePassword').addEventListener('click', function() {
        const passwordInput = document.getElementById('password');
        const icon = this;
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    });
</script>
{% endblock %}
