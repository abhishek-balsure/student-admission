{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block extra_css %}
<style>
    .error-page { min-height: calc(100vh - 250px); display: flex; align-items: center; justify-content: center; padding: 3rem; background: linear-gradient(135deg, var(--background) 0%, #e8eaf6 100%); }
    .error-card { background: white; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 3rem; text-align: center; max-width: 500px; }
    .error-icon { font-size: 5rem; color: var(--primary); margin-bottom: 1.5rem; }
    .error-code { font-size: 8rem; font-weight: 700; color: var(--primary); line-height: 1; margin-bottom: 0.5rem; font-family: 'Playfair Display', serif; }
    .error-title { font-size: 1.5rem; color: var(--text-dark); margin-bottom: 1rem; }
    .error-message { color: var(--text-muted); margin-bottom: 2rem; }
    .btn-home { padding: 0.75rem 2rem; background: var(--primary); color: white; border: none; border-radius: var(--radius-md); font-weight: 500; text-decoration: none; display: inline-block; transition: var(--transition); }
    .btn-home:hover { background: #0d1b60; color: white; transform: translateY(-2px); }
</style>
{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-card">
        <div class="error-icon">
            <i class="fas fa-search"></i>
        </div>
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">Oops! The page you're looking for doesn't exist or has been moved.</p>
        <a href="{{ url_for('index') }}" class="btn-home">
            <i class="fas fa-home me-2"></i> Back to Home
        </a>
    </div>
</div>
{% endblock %}
